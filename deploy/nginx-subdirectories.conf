# ============================================================
# YikaiCMS — 同一域名下放多个站点（每个一级子目录一个站）
#
#   https://demo.example.com/site-a/   → 磁盘 <站点根>/site-a/
#   https://demo.example.com/site-b/   → 磁盘 <站点根>/site-b/
#
# 放进 server 块即可。新增站点只需把程序放进新的一级目录，**不用再改 nginx**：
# 目录名从地址第一段自动取出，保护规则、安装锁、伪静态都按它套用。
# 只放一个子目录站、或站点嵌套在多级目录下，请用 deploy/SUBDIRECTORY.md 里的单站写法。
#
# 使用前把下面两处 fastcgi_pass 换成你的 PHP-FPM 地址（宝塔一般是 unix:/tmp/php-cgi-82.sock）。
# 宝塔用户：把本文件内容粘进站点的「配置文件」（不是「伪静态」框），并删掉宝塔默认的
# `include enable-php-xx.conf;` 一行——它与这里的 PHP 处理重复，且排在保护规则之前会让它们失效。
#
# 目录名只认字母、数字与 . _ -（与程序自动推导挂载点的规则一致）。
# 不是 YikaiCMS 的其他一级目录也会经过这里：保护规则只会多挡几个路径，找不到 index.php 时返回 404。
# ============================================================

# ── 1. 保护规则：必须写在下面的 \.php$ 之前（nginx 正则 location 按出现顺序，先匹配先生效）──

# 隐藏文件（.git、.env、.user.ini…）
location ~ ^/[A-Za-z0-9._-]+/(?:.*/)?\. {
    deny all;
}

# 程序目录、运行数据（含 SQLite 数据库）、初始数据库结构、部署样例
location ~ ^/[A-Za-z0-9._-]+/(?:config|storage|deploy|vendor|includes|bin|migrations|recipes|install/sql)/ {
    deny all;
}

# 上传目录里的 PHP 一律不执行（上传校验一旦被绕过就是 RCE）
location ~ ^/[A-Za-z0-9._-]+/uploads/.*\.(?:php|phtml|phar|php[0-9])$ {
    deny all;
}

# 文档、SQL、备份、安装锁、依赖清单
location ~* ^/[A-Za-z0-9._-]+/.*\.(?:md|sql|bak|example|dist|conf|lock|yml|yaml)$ {
    deny all;
}
location ~ ^/[A-Za-z0-9._-]+/(?:composer\.(?:json|lock)|package(?:-lock)?\.json)$ {
    deny all;
}

# ── 2. 安装器：该站已安装（存在 installed.lock）就关闭 ──
# 目录形式的 /site-a/install/ 先改写到入口文件：直接交给 PHP 的是个目录，PHP 只会回 403
location ~ ^/(?<yk_site>[A-Za-z0-9._-]+)/install/$ {
    if (-f $document_root/$yk_site/installed.lock) { return 403; }
    rewrite ^ /$yk_site/install/index.php last;
}
location ~ ^/(?<yk_site>[A-Za-z0-9._-]+)/install/index\.php$ {
    if (-f $document_root/$yk_site/installed.lock) { return 403; }
    if (!-f $request_filename) { return 404; }
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include        fastcgi_params;
}
location ~ ^/[A-Za-z0-9._-]+/install/.*\.php$ {
    deny all;
}

# ── 3. PHP ──
location ~ ^/[A-Za-z0-9._-]+/.+\.php$ {
    # 不存在的脚本不交给 PHP-FPM。用 if 而非 try_files：实测 try_files 在这里对不存在的
    # 文件没有返回 404（Windows 版 nginx 回了 403），if -f 在各平台行为一致
    if (!-f $request_filename) { return 404; }
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include        fastcgi_params;
}

# ── 4. 站点入口：静态文件直出，其余交给该站的 index.php（漂亮网址由程序路由）──
location ~ ^/(?<yk_site>[A-Za-z0-9._-]+)(?:/|$) {
    # 默认首页自己声明：面板把 index.html 排在前面时，/site-a/ 与 /site-a/admin/ 仍进 PHP
    index index.php index.html;
    try_files $uri $uri/ /$yk_site/index.php?$query_string;
}

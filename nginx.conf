# Yikai CMS Nginx Configuration
# 将以下配置添加到你的 server 块中

# 禁止访问隐藏文件
location ~ /\. {
    deny all;
}

# 禁止访问config目录
location ^~ /config/ {
    deny all;
}

# 禁止访问storage目录（SQLite数据库）
location ^~ /storage/ {
    deny all;
}

# 安装完成后禁止访问install目录
location ^~ /install/ {
    if (-f $document_root/installed.lock) {
        return 403;
    }
}

# 开放接口伪静态：/api/v1/<resource> → 分发器（?resource=<resource> 形式始终可用）
location ^~ /api/v1/ {
    rewrite ^/api/v1/([a-z_]+)/?$ /api/v1/index.php?resource=$1&$args last;
    try_files $uri $uri/ /api/v1/index.php?$args;
}

# ===== 静态 HTML 直出（开启后台「静态生成」即自动生效，开箱即用）=====
# 思路：所有 .html 请求先尝试 html/ 目录下的静态文件，命中则由 nginx 直出、不进 PHP；
# 未命中回落 @yikai_dynamic 走伪静态 → PHP。首页/无扩展名见末尾 location /。
# 关闭静态直出：删除 html/ 目录即可（命中失败自动回落，无需改配置）。

# 所有 .html：静态优先，未命中回落动态路由
location ~ \.html$ {
    try_files /html$uri @yikai_dynamic;
}

# 动态伪静态规则（原各 rewrite 收拢于此，供 try_files 回落；顺序：具体在前、通用在后）
location @yikai_dynamic {
    # 多语言 URL 前缀
    rewrite ^/(ja|en|zh-CN|zh-TW)/(.*)$ /$2?_lang=$1 last;

    # 新闻文章系统
    rewrite ^/news\.html$ /news.php last;
    rewrite ^/news/page/(\d+)\.html$ /news.php?page=$1 last;
    rewrite ^/news/article/(\d+)\.html$ /article.php?id=$1 last;
    rewrite ^/news/article/([a-z0-9_-]+)\.html$ /article.php?slug=$1 last;
    rewrite ^/news/([a-z0-9_-]+)/page/(\d+)\.html$ /news.php?cat=$1&page=$2 last;
    rewrite ^/news/([a-z0-9_-]+)\.html$ /news.php?cat=$1 last;

    # 栏目列表页
    rewrite ^/list/(\d+)/page/(\d+)\.html$ /list.php?id=$1&page=$2 last;
    rewrite ^/list/(\d+)\.html$ /list.php?id=$1 last;

    # 案例 / 招聘 / 下载 / 通用详情
    rewrite ^/case/(\d+)\.html$ /detail.php?id=$1 last;
    rewrite ^/case/([a-z0-9_-]+)\.html$ /detail.php?slug=$1 last;
    rewrite ^/job/(\d+)\.html$ /job_detail.php?id=$1 last;
    rewrite ^/download/detail/(\d+)\.html$ /detail.php?id=$1 last;
    rewrite ^/detail/(\d+)\.html$ /detail.php?id=$1 last;

    # 产品（数字ID优先，再分类分页、分类detail、分类列表）
    rewrite ^/product/(\d+)\.html$ /product.php?id=$1 last;
    rewrite ^/product/([a-z0-9_-]+)/page/(\d+)\.html$ /list.php?slug=product&cat=$1&page=$2 last;
    rewrite ^/product/([a-z0-9_-]+)/([a-z0-9_-]+)\.html$ /product.php?slug=$2 last;
    rewrite ^/product/([a-z0-9_-]+)\.html$ /list.php?slug=product&cat=$1 last;

    # 特殊页面（优先于通用 slug 规则）
    rewrite ^/about/history\.html$ /history.php last;
    rewrite ^/contact\.html$ /contact.php last;

    # 栏目列表 slug 分页
    rewrite ^/([a-z0-9_-]+)/page/(\d+)\.html$ /list.php?slug=$1&page=$2 last;

    # 单页
    rewrite ^/page/(\d+)\.html$ /page.php?id=$1 last;
    rewrite ^/([a-z0-9_-]+)/([a-z0-9_-]+)\.html$ /page.php?parent=$1&slug=$2 last;
    rewrite ^/([a-z0-9_-]+)\.html$ /page.php?slug=$1 last;

    # 兜底交给入口
    rewrite ^ /index.php last;
}

# PHP 处理
location ~ \.php$ {
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

# 静态文件缓存
location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 默认处理（首页 / 与无扩展名：同样静态优先，未命中回落动态）
location / {
    try_files /html$uri /html$uri/index.html $uri $uri/ @yikai_dynamic;
}


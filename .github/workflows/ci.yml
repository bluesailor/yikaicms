name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel in-progress runs from the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: php -l on every PHP file. Catches parse errors immediately. ───
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: php -l on all *.php
        run: |
          set -e
          # find every PHP file outside vendor/node_modules and lint it.
          find . -path ./vendor -prune -o -path ./node_modules -prune \
                 -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/lint.log 2>&1 \
            || (cat /tmp/lint.log && exit 1)
          # `find` doesn't fail on lint errors above; check the log explicitly.
          if grep -E 'Errors parsing|PHP Parse error' /tmp/lint.log; then
            cat /tmp/lint.log
            exit 1
          fi

  # ─── PHPUnit: model + controller + admin suites. SQLite in-memory. ───
  # Matrix starts at 8.2: the dev toolchain (psalm 6.x → symfony 7.4 /
  # webmozart-assert) requires PHP >= 8.2, so `composer install` of the
  # committed lock can't run on 8.0/8.1. Product runtime support for 8.0+
  # is still verified by the Lint job (php -l on 8.0–8.4).
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never

  # ─── 后台 CRUD 冒烟测试：起一个全新 SQLite 装机 + php 内置服务器，
  # ─── 登录后逐类 POST「新建」（栏目/产品/内容/文章/下载/招聘），断言无
  # ─── Fatal/undefined-function 且保存成功。专抓 job_edit 的 getAdminId()
  # ─── 那类「控制器层 Fatal」回归——单元测试与 Psalm baseline 都漏掉的类型。
  # ─── 矩阵覆盖 8.0（产品承诺的最低版）与 8.2：用 --no-dev 安装（= 发行包
  # ─── 真实形态，且不受 dev 工具链要求 8.2+ 的限制）。v1.13.0 的 pinyin 事故
  # ─── （生产依赖要求 PHP 8.1、8.0 主机保存文章 ParseError 500）由本矩阵
  # ─── 的 8.0 腿拦截：composer 平台约束、vendor 语法、真实保存 三层全覆盖。
  smoke:
    name: Admin CRUD Smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-nodev-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-nodev-${{ matrix.php }}-

      - name: composer install（仅生产依赖；8.0 上失败 = 依赖的 PHP 约束与产品承诺冲突）
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Lint vendor（生产依赖在本 PHP 版本下的语法兼容性）
        run: |
          find vendor -type f -name '*.php' -print0 \
            | xargs -0 -n50 php -l > /tmp/vendor-lint.log 2>&1 \
            || { grep -B1 -E 'Errors parsing|Parse error' /tmp/vendor-lint.log; exit 1; }

      - name: Prepare fresh SQLite install
        run: php tests/smoke/setup.php

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/admin/login.php > /dev/null && break
            sleep 0.5
          done

      - name: Run admin CRUD smoke test
        run: php tests/smoke/admin_crud.php

      - name: Dump error logs on failure（ErrorHandler 落盘的真实堆栈）
        if: failure()
        run: |
          echo "=== storage/logs ==="; cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== php server log ==="; tail -50 /tmp/php-server.log 2>/dev/null || true

  # ─── Psalm static analysis. Blocking: existing legacy noise is frozen in
  # ─── psalm-baseline.xml, so only NEW issues fail the build. Shrink the
  # ─── baseline over time (findUnusedBaselineEntry flags fixed entries).
  psalm:
    name: Psalm static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-psalm-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress --output-format=github

  # ─── lang key consistency: every __('xxx') / configLang(_, 'xxx') key must
  # ─── be defined in every enabled lang file (zh-CN / en / ja). Blocks merges.
  lang-keys:
    name: Lang Key Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Run lang key check
        run: php tools/check_lang_keys.php

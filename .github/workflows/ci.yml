name: CI

on:
  push:
    # release/** 必须在列：稳定候选分支才是真正出版本的地方，
    # 它上面的修复如果不跑 CI，等于发版前最后一段路没有护栏。
    branches: [main, master, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, master, develop, 'release/**']

# Cancel in-progress runs from the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: php -l on every PHP file. Catches parse errors immediately. ───
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: php -l on all *.php
        run: |
          set -e
          # find every PHP file outside vendor/node_modules and lint it.
          find . -path ./vendor -prune -o -path ./node_modules -prune \
                 -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/lint.log 2>&1 \
            || (cat /tmp/lint.log && exit 1)
          # `find` doesn't fail on lint errors above; check the log explicitly.
          if grep -E 'Errors parsing|PHP Parse error' /tmp/lint.log; then
            cat /tmp/lint.log
            exit 1
          fi

  # ─── PHPUnit: model + controller + admin suites. SQLite in-memory. ───
  # Matrix starts at 8.2: the dev toolchain (psalm 6.x → symfony 7.4 /
  # webmozart-assert) requires PHP >= 8.2, so `composer install` of the
  # committed lock can't run on 8.0/8.1. Product runtime support for 8.0+
  # is still verified by the Lint job (php -l on 8.0–8.4).
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Blox asset classification
        run: php bin/blox-assets.php verify-policy .

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never

  # ─── 后台 CRUD 冒烟测试：起一个全新 SQLite 装机 + php 内置服务器，
  # ─── 登录后逐类 POST「新建」（栏目/内容/产品及分类标签/下载/招聘/友链/时间线），
  # ─── 并回归栏目图保留，断言无 Fatal/undefined-function 且保存成功。专抓 job_edit 的 getAdminId()
  # ─── 那类「控制器层 Fatal」回归——单元测试与 Psalm baseline 都漏掉的类型。
  # ─── 矩阵覆盖 8.0（产品承诺的最低版）与 8.2：用 --no-dev 安装（= 发行包
  # ─── 真实形态，且不受 dev 工具链要求 8.2+ 的限制）。v1.13.0 的 pinyin 事故
  # ─── （生产依赖要求 PHP 8.1、8.0 主机保存文章 ParseError 500）由本矩阵
  # ─── 的 8.0 腿拦截：composer 平台约束、vendor 语法、真实保存 三层全覆盖。
  smoke:
    name: Admin CRUD Smoke (PHP ${{ matrix.php }} / ${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lang 维度：客户站大量是纯英文/日文，而测试一直只跑中文——「新建行 lang
        # 落错桶、列表查不到」这类 bug 在中文站上根本不成立（默认值恰好对）。
        # en 腿只挂在 8.2 上，避免矩阵翻倍。
        include:
          - php: '8.0'
            lang: 'zh-CN'
          - php: '8.2'
            lang: 'zh-CN'
          - php: '8.2'
            lang: 'en'
    steps:
      - uses: actions/checkout@v4
        with:
          # The default-theme upgrade gate reads real historical install SQL from tags.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-nodev-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-nodev-${{ matrix.php }}-

      - name: composer install（仅生产依赖；8.0 上失败 = 依赖的 PHP 约束与产品承诺冲突）
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Lint vendor（生产依赖在本 PHP 版本下的语法兼容性）
        run: |
          find vendor -type f -name '*.php' -print0 \
            | xargs -0 -n50 php -l > /tmp/vendor-lint.log 2>&1 \
            || { grep -B1 -E 'Errors parsing|Parse error' /tmp/vendor-lint.log; exit 1; }

      # 全新安装 ≡ 老站跑完全部迁移。install SQL 与 migrations 是两条独立演进的
      # 路径，两个方向都漏过（v1.11.0 新装缺列 500 / cile.cn 升级缺 9 列），单向
      # 检查抓不全。排在装机之前：本步不依赖 config.php，且失败时后面都没意义。
      - name: Schema parity（install SQL ↔ migrations 双向对拍）
        run: php tests/smoke/schema_parity.php

      - name: Default theme → Blox upgrade compatibility
        if: ${{ matrix.php == '8.2' && matrix.lang == 'zh-CN' }}
        run: |
          for tag in v1.12.9 v1.14.0 v1.17.0 v1.17.2 v1.17.3.2 v1.18.1; do
            php tests/smoke/blox_upgrade_compat.php --from="$tag"
          done

      - name: Prepare fresh SQLite install
        run: php tests/smoke/setup.php --lang=${{ matrix.lang }}

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/admin/login.php > /dev/null && break
            sleep 0.5
          done

      - name: Run admin CRUD smoke test
        run: php tests/smoke/admin_crud.php

      # CRUD 冒烟用的是超管，hasPermission() 对超管恒真——越权与死权限问题
      # 它结构性地看不见。这一步换非超管角色跑权限矩阵，专抓那一类。
      - name: Permission matrix（角色 × 端点 × 方法）
        run: php tests/smoke/permission_matrix.php

      # Blox 头尾激活生命周期（r7.1）：home/单页/exclude/footer/fail-closed/旧主题回退。
      # 前身是一次性验证脚本——审计指出这些路径在 CI 零覆盖后转为常驻。
      - name: Blox area activation lifecycle
        run: php tests/smoke/blox_area_activation.php

      - name: Dump error logs on failure（ErrorHandler 落盘的真实堆栈）
        if: failure()
        run: |
          echo "=== storage/logs ==="; cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== php server log ==="; tail -50 /tmp/php-server.log 2>/dev/null || true

  # ─── Blox 付费套件（注入后全量 PHPUnit）：付费源码与公开代码的契约测试
  # ─── （BloxEditor*Contract / TemplateImporter / Catalog / RemoteProvider，
  # ─── 55 tests）只有注入后才存在。secret 不在场 → guard 显式 skip，不假红。
  # ─── 与 e2e 不同：单测确定性高，本 job 为强制门禁（无 continue-on-error）。
  blox-suite:
    name: Blox Suite (injected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 付费源码注入：BLOX_DEPLOY_KEY（deploy key 私钥，只读授权 yikaicms-blox）
      # 在场时浅克隆私库并覆盖进构建树；不在场（fork / 无权环境）时静默跳过，
      # 由后续 presence guard 显式标注 skipped。密钥用完即删。
      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      - name: Check Blox source presence
        id: blox_src
        run: |
          if [ -f admin/blox_editor.php ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Blox suite skipped::paid sources not injected (no BLOX_DEPLOY_KEY). SKIPPED, not failed."
          fi

      - name: Setup PHP
        if: steps.blox_src.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: composer install
        if: steps.blox_src.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Blox paid asset composition
        if: steps.blox_src.outputs.present == 'true'
        run: php bin/blox-assets.php verify-source .

      - name: Run PHPUnit (full suite incl. Blox contracts)
        if: steps.blox_src.outputs.present == 'true'
        run: vendor/bin/phpunit --colors=never

      - name: Blox i18n gate (strict scope incl. paid sources)
        if: steps.blox_src.outputs.present == 'true'
        run: php tools/check_blox_i18n.php

  # ─── 真实免费发行包：不能只在源工作树上验证资产分类。注入完整源码后运行
  # ─── build.sh，校验 ZIP 哈希，再解包对最终产物执行 verify-free。
  free-package:
    name: Blox Free Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      - name: Check Blox source presence
        id: blox_src
        run: |
          if [ -f admin/blox_editor.php ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Blox free package skipped::paid sources not injected (no BLOX_DEPLOY_KEY). SKIPPED, not failed."
          fi

      - name: Setup PHP
        if: steps.blox_src.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        if: steps.blox_src.outputs.present == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build free release package
        if: steps.blox_src.outputs.present == 'true'
        env:
          DELTA_BASES: '0'
        run: bash build.sh

      - name: Verify final ZIP composition
        if: steps.blox_src.outputs.present == 'true'
        id: package
        run: |
          VERSION="$(php -r "require 'config/version.php'; echo CMS_VERSION;")"
          ZIP="releases/yikaicms-v${VERSION}.zip"
          SHA="releases/yikaicms-v${VERSION}.sha256"
          test -f "$ZIP" && test -f "$SHA"
          sha256sum -c "$SHA"
          rm -rf /tmp/yikaicms-free-package
          mkdir -p /tmp/yikaicms-free-package
          unzip -q "$ZIP" -d /tmp/yikaicms-free-package
          PACKAGE_ROOT="/tmp/yikaicms-free-package/yikaicms-v${VERSION}"
          test -d "$PACKAGE_ROOT"
          php bin/blox-assets.php verify-free "$PACKAGE_ROOT"
          test ! -e "$PACKAGE_ROOT/config/config.php"
          test ! -e "$PACKAGE_ROOT/tests"
          # v1.18.0 起 Blox 编辑器及其 API（含 blox_home_api.php）随免费包分发；
          # 付费边界改为 icon-maker 与 blox-example，另防 admin-local 开发残留入包。
          test ! -e "$PACKAGE_ROOT/plugins/icon-maker"
          test ! -e "$PACKAGE_ROOT/plugins/blox-example"
          test ! -e "$PACKAGE_ROOT/plugins/logo-maker/admin-local.php"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload verified free package
        if: steps.blox_src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yikaicms-free-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 7

  # ─── R31 已完成本地稳定期，R32 将同一受保护运行器提升为强制 CI 门禁。
  e2e:
    name: Blox Browser Regression
    runs-on: ubuntu-latest
    # 强制门禁（与单测同级）：r8–r10 观察期全绿；r11 首次转强制被并行图标线的
    # 半成品 404 击穿后回退，图标专项原子入库（icon-library-integration 轮）后恢复。
    # 浏览器下载偶发卡死；单次 7 分钟超时后自动重试，整项留足测试执行时间。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 付费源码注入：BLOX_DEPLOY_KEY（deploy key 私钥，只读授权 yikaicms-blox）
      # 在场时浅克隆私库并覆盖进构建树；不在场（fork / 无权环境）时静默跳过，
      # 由后续 presence guard 显式标注 skipped。密钥用完即删。
      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      # Blox 编辑器源码属付费包，不随公开仓库分发（.gitignore 付费源码规则）。
      # 干净 checkout 里没有它时，后续步骤全部跳过并显式标注 skipped——
      # 「跳过」必须和「失败」长得不一样，否则这个 job 会永久红并被无视。
      - name: Check Blox source presence
        id: blox_src
        run: |
          if [ -f admin/blox_editor.php ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Blox browser baseline skipped::admin/blox_editor.php is not present in this checkout (paid-source distribution rules). Baseline SKIPPED, not failed. Inject the paid sources (private CI) to run it."
          fi

      - name: Setup PHP
        if: steps.blox_src.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, json, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.blox_src.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        if: steps.blox_src.outputs.present == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Verify Blox paid asset composition
        if: steps.blox_src.outputs.present == 'true'
        run: php bin/blox-assets.php verify-source .

      - name: Install Node dependencies
        if: steps.blox_src.outputs.present == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.blox_src.outputs.present == 'true'
        run: bash .github/scripts/install-playwright-chromium.sh

      - name: Run Blox browser regression
        if: steps.blox_src.outputs.present == 'true'
        env:
          BLOX_E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/e2e
          BLOX_E2E_REPORT_DIR: ${{ github.workspace }}/playwright-report
          BLOX_E2E_SERVER_LOG: ${{ github.workspace }}/test-results/e2e/php-server.log
        run: |
          node tests/e2e/run-local.js --grep "@ci"
          node tests/e2e/run-local.js --free tests/e2e/blox-page.spec.js --project=desktop-1440

      - name: Dump application logs on failure
        if: failure() && steps.blox_src.outputs.present == 'true'
        run: |
          echo "=== storage/logs ==="
          cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== php server log ==="
          cat test-results/e2e/php-server.log 2>/dev/null || echo "(no server log)"

      - name: Upload Playwright diagnostics
        if: failure() && steps.blox_src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blox-playwright-diagnostics
          path: |
            test-results/e2e
            playwright-report
            storage/logs
          if-no-files-found: ignore
          retention-days: 7

  # ─── Psalm static analysis. Blocking: existing legacy noise is frozen in
  # ─── psalm-baseline.xml, so only NEW issues fail the build. Shrink the
  # ─── baseline over time (findUnusedBaselineEntry flags fixed entries).
  psalm:
    name: Psalm static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-psalm-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress --output-format=github

  # ─── lang key consistency: every __('xxx') / configLang(_, 'xxx') key must
  # ─── be defined in every enabled lang file (zh-CN / en / ja). Blocks merges.
  js-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Run inside the test directory so Node discovers *.test.js without shell globs or directory-argument assumptions.
      - name: node --test
        working-directory: tests/js
        run: node --test

  lang-keys:
    name: Lang Key Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Run lang key check
        run: php tools/check_lang_keys.php

      - name: Home language default fallback gate
        run: php tools/check_home_language_defaults.php

      - name: Hardcoded currency symbol gate
        run: php tools/check_currency_symbols.php

      # Blox 三语化门禁（严格档，2026-08-07 起 351 处元素标签清零后全范围生效）：
      # \uXXXX 转义与硬编码中文回潮即红。付费源码不在 checkout 时自动跳过对应文件。
      - name: Blox i18n regression gate
        run: php tools/check_blox_i18n.php

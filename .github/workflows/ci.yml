name: CI

on:
  push:
    # release/** 必须在列：稳定候选分支才是真正出版本的地方，
    # 它上面的修复如果不跑 CI，等于发版前最后一段路没有护栏。
    branches: [main, master, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, master, develop, 'release/**']

# Cancel in-progress runs from the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: php -l on every PHP file. Catches parse errors immediately. ───
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: php -l on all *.php
        run: |
          set -e
          # find every PHP file outside vendor/node_modules and lint it.
          find . -path ./vendor -prune -o -path ./node_modules -prune \
                 -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /tmp/lint.log 2>&1 \
            || (cat /tmp/lint.log && exit 1)
          # `find` doesn't fail on lint errors above; check the log explicitly.
          if grep -E 'Errors parsing|PHP Parse error' /tmp/lint.log; then
            cat /tmp/lint.log
            exit 1
          fi

  # ─── PHPUnit: model + controller + admin suites. SQLite in-memory. ───
  # Matrix is 8.2–8.4: the dev toolchain (psalm 6.x → symfony 7.4 /
  # webmozart-assert) pins the committed lock to that range, so `composer
  # install` can't resolve on 8.0/8.1 (too old) or 8.5 (lock has no
  # 8.5-compatible set yet). Product runtime support for 8.0–8.5 is verified
  # by the Lint job (php -l on 8.0–8.5); raise the ceiling here once the dev
  # toolchain lock declares 8.5.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Blox asset classification
        run: php bin/blox-assets.php verify-policy .

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never

  # ─── 后台 CRUD 冒烟测试：起一个全新 SQLite 装机 + php 内置服务器，
  # ─── 登录后逐类 POST「新建」（栏目/内容/产品及分类标签/下载/招聘/友链/时间线），
  # ─── 并回归栏目图保留，断言无 Fatal/undefined-function 且保存成功。专抓 job_edit 的 getAdminId()
  # ─── 那类「控制器层 Fatal」回归——单元测试与 Psalm baseline 都漏掉的类型。
  # ─── 矩阵覆盖 8.0（产品承诺的最低版）与 8.2：用 --no-dev 安装（= 发行包
  # ─── 真实形态，且不受 dev 工具链要求 8.2+ 的限制）。v1.13.0 的 pinyin 事故
  # ─── （生产依赖要求 PHP 8.1、8.0 主机保存文章 ParseError 500）由本矩阵
  # ─── 的 8.0 腿拦截：composer 平台约束、vendor 语法、真实保存 三层全覆盖。
  # ─── extensions 里的 simplexml 是给 product-import 插件的 XlsxReader 测试用的；
  # ─── 它不是核心必需项（见 RuntimeRequirements），CI 装它只为让那条插件测试能跑。
  smoke:
    name: Admin CRUD Smoke (PHP ${{ matrix.php }} / ${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lang 维度：客户站大量是纯英文/日文，而测试一直只跑中文——「新建行 lang
        # 落错桶、列表查不到」这类 bug 在中文站上根本不成立（默认值恰好对）。
        # en 腿只挂在 8.2 上，避免矩阵翻倍。
        include:
          - php: '8.0'
            lang: 'zh-CN'
          - php: '8.2'
            lang: 'zh-CN'
          - php: '8.2'
            lang: 'en'
    steps:
      - uses: actions/checkout@v4
        with:
          # The default-theme upgrade gate reads real historical install SQL from tags.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, curl, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-nodev-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-nodev-${{ matrix.php }}-

      - name: composer install（仅生产依赖；8.0 上失败 = 依赖的 PHP 约束与产品承诺冲突）
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Lint vendor（生产依赖在本 PHP 版本下的语法兼容性）
        run: |
          find vendor -type f -name '*.php' -print0 \
            | xargs -0 -n50 php -l > /tmp/vendor-lint.log 2>&1 \
            || { grep -B1 -E 'Errors parsing|Parse error' /tmp/vendor-lint.log; exit 1; }

      - name: PHP 8.0 upgrade entry ordering smoke
        if: ${{ matrix.php == '8.0' }}
        run: php tests/smoke/php80_upgrade_entry_order.php

      # 全新安装 ≡ 老站跑完全部迁移。install SQL 与 migrations 是两条独立演进的
      # 路径，两个方向都漏过（v1.11.0 新装缺列 500 / cile.cn 升级缺 9 列），单向
      # 检查抓不全。排在装机之前：本步不依赖 config.php，且失败时后面都没意义。
      - name: Schema parity（install SQL ↔ migrations 双向对拍）
        run: php tests/smoke/schema_parity.php

      - name: Default theme → Blox upgrade compatibility
        if: ${{ matrix.php == '8.2' && matrix.lang == 'zh-CN' }}
        run: |
          # 升级回归矩阵起点：远古基线 + 每条大版本线 + 1.18.x 全部 patch（审计 #18）。
          # 发新版后把上一个正式号补进来。
          for tag in v1.12.9 v1.14.0 v1.17.0 v1.17.2 v1.17.3.2 v1.18.1 v1.18.2 v1.18.3 v1.18.4 v1.18.5; do
            php tests/smoke/blox_upgrade_compat.php --from="$tag"
          done

      - name: Prepare fresh SQLite install
        run: php tests/smoke/setup.php --lang=${{ matrix.lang }}

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/admin/login.php > /dev/null && break
            sleep 0.5
          done

      - name: Run admin CRUD smoke test
        run: php tests/smoke/admin_crud.php

      # 后台页面 GET 全量渲染冒烟：登录态把每个 admin/*.php 渲染一遍，断言无 500。
      # 由来：setting_email 预设下拉的数组键 int 化 TypeError 500 穿过了
      # php -l/单测/Psalm/CRUD冒烟 四层（页面渲染期错误此前零覆盖）。
      - name: Admin pages render smoke（全部后台页 GET 无 500）
        run: php tests/smoke/admin_pages.php

      # 升级回滚 e2e：沙箱增量包走 prepare→batch→finalize→rollback 四步，
      # 断言覆盖前快照 / rollback.json 清单 / 三类文件（覆盖·新建·删除）全还原。
      # 回滚是升级打挂站点时的最后保障，此前主链路在 CI 零覆盖。
      - name: Upgrade rollback e2e（事务化升级回滚全链路）
        run: php tests/smoke/upgrade_rollback.php

      # 自动升级故障注入：真实制造故障（抢锁、毁快照目录、塞会失败的迁移、损坏状态文件），
      # 断言它「按预期失败并回滚」而不是「悄悄记成功」。
      # 由来：codex 审计发现「续跑判定位置错」时，我的源码契约断言是全绿的；
      # 补这套注入测试后又立刻抓出「Migrator::runOne 不抛异常导致迁移失败被忽略」。
      - name: Auto-upgrade fault injection（无人值守升级的失败路径）
        run: php tests/smoke/auto_upgrade_faults.php

      # CRUD 冒烟用的是超管，hasPermission() 对超管恒真——越权与死权限问题
      # 它结构性地看不见。这一步换非超管角色跑权限矩阵，专抓那一类。
      - name: Permission matrix（角色 × 端点 × 方法）
        run: php tests/smoke/permission_matrix.php

      # Blox 头尾激活生命周期（r7.1）：home/单页/exclude/footer/fail-closed/旧主题回退。
      # 前身是一次性验证脚本——审计指出这些路径在 CI 零覆盖后转为常驻。
      - name: Blox area activation lifecycle
        run: php tests/smoke/blox_area_activation.php

      - name: Dump error logs on failure（ErrorHandler 落盘的真实堆栈）
        if: failure()
        run: |
          echo "=== storage/logs ==="; cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== php server log ==="; tail -50 /tmp/php-server.log 2>/dev/null || true

  # ─── MySQL 5.7 真实装机腿：SQLite 对拍能发现 schema 漂移，但抓不到
  # ─── MySQL 方言、驱动类型和 InnoDB 事务行为。通过正式 HTTP 安装器装英文站，
  # ─── 再复用后台 CRUD / 全页面渲染冒烟，直接守住生产目标数据库。
  mysql57:
    name: MySQL 5.7 Install & Admin Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: yikaicms_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Schema parity（install SQL ↔ migrations 双向对拍）
        run: php tests/smoke/schema_parity.php

      - name: Start uninstalled site
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -A "YikaiCMS-MySQL-CI" http://127.0.0.1:8080/install/index.php > /dev/null && break
            sleep 1
          done
          curl -sf -A "YikaiCMS-MySQL-CI" http://127.0.0.1:8080/install/index.php > /dev/null

      - name: Install through the real HTTP installer（English + demo）
        run: |
          response="$(curl -fsS -A "YikaiCMS-MySQL-CI" -X POST http://127.0.0.1:8080/install/index.php \
            --data-urlencode "action=install" \
            --data-urlencode "db_driver=mysql" \
            --data-urlencode "db_host=127.0.0.1" \
            --data-urlencode "db_port=3306" \
            --data-urlencode "db_name=yikaicms_ci" \
            --data-urlencode "db_user=root" \
            --data-urlencode "db_pass=ci-root" \
            --data-urlencode "db_prefix=yikai_" \
            --data-urlencode "admin_user=admin" \
            --data-urlencode "admin_pass=smoke@Test123" \
            --data-urlencode "admin_email=ci@example.test" \
            --data-urlencode "site_name=YikaiCMS MySQL CI" \
            --data-urlencode "site_url=http://127.0.0.1:8080" \
            --data-urlencode "site_lang=en" \
            --data-urlencode "admin_lang=en" \
            --data-urlencode "install_demo=1")"
          INSTALL_RESPONSE="$response" php -r '
            $payload = json_decode((string) getenv("INSTALL_RESPONSE"), true);
            if (!is_array($payload) || empty($payload["success"])) {
                fwrite(STDERR, "Installer failed: " . ($payload["message"] ?? "invalid JSON response") . PHP_EOL);
                exit(1);
            }
          '

      - name: Verify MySQL runtime, migrations and transaction behavior
        env:
          EXPECTED_MYSQL_SERIES: '5.7'
        run: php tests/smoke/mysql_runtime.php

      - name: Run admin CRUD smoke on MySQL
        run: php tests/smoke/admin_crud.php

      - name: Render all admin pages on MySQL
        run: php tests/smoke/admin_pages.php

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== storage/logs ==="
          cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== php server log ==="
          tail -100 /tmp/php-server.log 2>/dev/null || true

  # ─── Blox 付费套件（注入后全量 PHPUnit）：付费源码与公开代码的契约测试
  # ─── （BloxEditor*Contract / TemplateImporter / Catalog / RemoteProvider，
  # ─── 55 tests）只有注入后才存在。secret 不在场 → guard 显式 skip，不假红。
  # ─── 与 e2e 不同：单测确定性高，本 job 为强制门禁（无 continue-on-error）。
  blox-suite:
    name: Blox Suite (injected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 付费源码注入：BLOX_DEPLOY_KEY（deploy key 私钥，只读授权 yikaicms-blox）
      # 在场时浅克隆私库并覆盖进构建树；不在场（fork / 无权环境）时静默跳过，
      # 由后续 presence guard 显式标注 skipped。密钥用完即删。
      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      - name: Check Blox source presence
        id: blox_src
        run: |
          if [ -f admin/blox_editor.php ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Blox suite skipped::paid sources not injected (no BLOX_DEPLOY_KEY). SKIPPED, not failed."
          fi

      - name: Setup PHP
        if: steps.blox_src.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: composer install
        if: steps.blox_src.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Blox paid asset composition
        if: steps.blox_src.outputs.present == 'true'
        run: php bin/blox-assets.php verify-source .

      - name: Run PHPUnit (full suite incl. Blox contracts)
        if: steps.blox_src.outputs.present == 'true'
        run: vendor/bin/phpunit --colors=never

      - name: Blox i18n gate (strict scope incl. paid sources)
        if: steps.blox_src.outputs.present == 'true'
        run: php tools/check_blox_i18n.php

  # ─── 真实 N-1 包升级：从已发布的 v1.19.6 完整包安装旧站，再通过
  # ─── prepare/batch/finalize 管道覆盖当前候选完整包并跑完迁移。
  # ─── PHP 8.0 与 8.2 各跑一次，守住旧共享主机与推荐运行环境两条路径。
  # ─── 这条专门覆盖源码树、全新安装和两文件回滚沙箱都看不到的客户升级路径。
  n-minus-one-upgrade:
    name: PHP ${{ matrix.php }} N-1 Package Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2']
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, curl, json, gd, fileinfo, dom, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build current full package
        run: bash build.sh 1.19.7 --no-delta

      - name: Fetch and verify published v1.19.6 package
        run: |
          curl -fL --retry 3 -o /tmp/yikaicms-v1.19.6.zip \
            https://github.com/bluesailor/yikaicms/releases/download/v1.19.6/yikaicms-v1.19.6.zip
          echo "acac251a555215247f7d2e4dfd2bed6ea3b25c59174d17653ef62f42aab4fe88  /tmp/yikaicms-v1.19.6.zip" | sha256sum -c -

      - name: Upgrade real v1.19.6 package to candidate
        run: >-
          php tests/smoke/package_upgrade.php
          --from-package=/tmp/yikaicms-v1.19.6.zip
          --to-package=releases/yikaicms-v1.19.7.zip
          --from=1.19.6 --to=1.19.7
          --db=mysql --db-host=127.0.0.1 --db-port=3306
          --db-user=root --db-pass=ci-root

  # ─── 真实免费发行包：不能只在源工作树上验证资产分类。注入完整源码后运行
  # ─── build.sh，校验 ZIP 哈希，再解包对最终产物执行 verify-free。
  free-package:
    name: Blox Free Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      - name: Check Blox source presence
        id: blox_src
        run: |
          if [ -f admin/blox_editor.php ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Blox free package skipped::paid sources not injected (no BLOX_DEPLOY_KEY). SKIPPED, not failed."
          fi

      - name: Setup PHP
        if: steps.blox_src.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        if: steps.blox_src.outputs.present == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build free release package
        if: steps.blox_src.outputs.present == 'true'
        env:
          DELTA_BASES: '0'
        run: bash build.sh

      - name: Verify final ZIP composition
        if: steps.blox_src.outputs.present == 'true'
        id: package
        run: |
          VERSION="$(php -r "require 'config/version.php'; echo CMS_VERSION;")"
          ZIP="releases/yikaicms-v${VERSION}.zip"
          SHA="releases/yikaicms-v${VERSION}.sha256"
          test -f "$ZIP" && test -f "$SHA"
          sha256sum -c "$SHA"
          rm -rf /tmp/yikaicms-free-package
          mkdir -p /tmp/yikaicms-free-package
          unzip -q "$ZIP" -d /tmp/yikaicms-free-package
          PACKAGE_ROOT="/tmp/yikaicms-free-package/yikaicms-v${VERSION}"
          test -d "$PACKAGE_ROOT"
          php tools/release-artifact-smoke.php "$ZIP"
          php bin/blox-assets.php verify-free "$PACKAGE_ROOT"
          test ! -e "$PACKAGE_ROOT/config/config.php"
          test ! -e "$PACKAGE_ROOT/tests"
          # v1.18.0 起 Blox 编辑器及其 API（含 blox_home_api.php）随免费包分发；
          # 付费边界改为 icon-maker 与 blox-example，另防 admin-local 开发残留入包。
          test ! -e "$PACKAGE_ROOT/plugins/icon-maker"
          test ! -e "$PACKAGE_ROOT/plugins/blox-example"
          test ! -e "$PACKAGE_ROOT/plugins/logo-maker/admin-local.php"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload verified free package
        if: steps.blox_src.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yikaicms-free-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 7

  # ─── R7：四个独立浏览器分片。PR 按路径分流；主线、发布候选和非 PR
  # ─── 事件跑完整矩阵。每个 spec 由 run-shard.js 建立独立临时站点/数据库。
  e2e_plan:
    name: Plan Blox browser shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select browser shards
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            node tools/ci-e2e-plan.js --full
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/yikai-changed-files.txt
          node tools/ci-e2e-plan.js --files-file=/tmp/yikai-changed-files.txt

  e2e_shards:
    name: Blox Browser Regression (${{ matrix.shard }})
    needs: e2e_plan
    if: needs.e2e_plan.outputs.has_shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Blox paid sources
        env:
          BLOX_DEPLOY_KEY: ${{ secrets.BLOX_DEPLOY_KEY }}
        run: bash .github/scripts/inject-blox.sh

      - name: Check Blox source presence
        run: |
          test -f admin/blox_editor.php || {
            echo "::error title=Blox browser baseline unavailable::planned browser shard is missing admin/blox_editor.php"
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Verify Blox paid asset composition
        run: php bin/blox-assets.php verify-source .

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: bash .github/scripts/install-playwright-chromium.sh

      - name: Run browser shard
        env:
          BLOX_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/test-results/e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/e2e/run-shard.js ${{ matrix.shard }}

      - name: Dump application logs on failure
        if: failure()
        run: |
          echo "=== storage/logs ==="
          cat storage/logs/error-*.log 2>/dev/null || echo "(no error log)"
          echo "=== shard server logs ==="
          find test-results/e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }} -name php-server.log -type f -print -exec tail -100 {} \; 2>/dev/null || true

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blox-playwright-diagnostics-${{ matrix.shard }}
          path: |
            test-results/e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
            storage/logs
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Blox Browser Regression
    if: always()
    needs: [e2e_plan, e2e_shards]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce planned browser coverage
        env:
          PLAN_RESULT: ${{ needs.e2e_plan.result }}
          SHARDS_RESULT: ${{ needs.e2e_shards.result }}
          HAS_SHARDS: ${{ needs.e2e_plan.outputs.has_shards }}
          SUMMARY: ${{ needs.e2e_plan.outputs.summary }}
        run: |
          echo "Planned browser shards: ${SUMMARY:-none}"
          test "$PLAN_RESULT" = success
          if [ "$HAS_SHARDS" = true ]; then
            test "$SHARDS_RESULT" = success
          fi

  # ─── Psalm static analysis. Blocking: existing legacy noise is frozen in
  # ─── psalm-baseline.xml, so only NEW issues fail the build. Shrink the
  # ─── baseline over time (findUnusedBaselineEntry flags fixed entries).
  psalm:
    name: Psalm static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, json, gd, fileinfo, dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-psalm-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress --output-format=github

  # ─── lang key consistency: every __('xxx') / configLang(_, 'xxx') key must
  # ─── be defined in every enabled lang file (zh-CN / en / ja). Blocks merges.
  js-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP for CLI error-handler regression
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Run inside the test directory so Node discovers *.test.js without shell globs or directory-argument assumptions.
      - name: node --test
        working-directory: tests/js
        run: node --test

  lang-keys:
    name: Lang Key Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Run lang key check
        run: php tools/check_lang_keys.php

      - name: Home language default fallback gate
        run: php tools/check_home_language_defaults.php

      - name: Hardcoded currency symbol gate
        run: php tools/check_currency_symbols.php

      # Blox 三语化门禁（严格档，2026-08-07 起 351 处元素标签清零后全范围生效）：
      # \uXXXX 转义与硬编码中文回潮即红。付费源码不在 checkout 时自动跳过对应文件。
      - name: Blox i18n regression gate
        run: php tools/check_blox_i18n.php
